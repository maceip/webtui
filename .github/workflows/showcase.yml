name: Deploy Showcase to Pages

# Triggers on push to ANY branch and on manual dispatch.
# Note: GitHub Pages has a single deployment slot per repo, so this
# workflow conflicts with web.yml. The latest run wins.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel in-progress runs when a new push comes in — we only care
# about the latest commit's showcase.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Build showcase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all packages
        run: bun run build

      - name: Assemble showcase artifact
        run: |
          mkdir -p _site/css/themes
          cp -r showcase/. _site/
          cp packages/css/dist/full.css _site/css/webtui.css
          cp packages/theme-nord/dist/index.css _site/css/themes/nord.css
          cp packages/theme-gruvbox/dist/index.css _site/css/themes/gruvbox.css
          cp packages/theme-catppuccin/dist/index.css _site/css/themes/catppuccin.css
          cp packages/theme-dracula/dist/index.css _site/css/themes/dracula.css
          cp packages/theme-synthwave/dist/index.css _site/css/themes/synthwave.css
          cp packages/theme-tokyo-night/dist/index.css _site/css/themes/tokyo-night.css
          ls -la _site _site/css _site/css/themes

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
