name: E2E tests

# Runs Playwright smoke tests against a remote browser hosted by
# Microsoft Playwright Testing. The runner spins up the showcase
# locally (bind to 127.0.0.1) and the remote browser reaches it
# through Playwright's exposed-loopback tunnel.
#
# Required secrets:
#   PLAYWRIGHT_SERVICE_URL          wss endpoint for the workspace
#   PLAYWRIGHT_SERVICE_ACCESS_TOKEN access key for the workspace

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (Chromium via remote service)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      PLAYWRIGHT_SERVICE_URL: ${{ secrets.PLAYWRIGHT_SERVICE_URL }}
      PLAYWRIGHT_SERVICE_ACCESS_TOKEN: ${{ secrets.PLAYWRIGHT_SERVICE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Playwright smoke tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test artifacts (traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
