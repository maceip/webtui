name: E2E tests

# Runs Playwright smoke tests against a remote browser hosted by
# Microsoft Playwright Testing. The runner spins up the showcase
# locally (bind to 127.0.0.1) and the remote browser reaches it
# through Playwright's exposed-loopback tunnel.
#
# Required secrets:
#   PLAYWRIGHT_SERVICE_URL          wss endpoint for the workspace
#   PLAYWRIGHT_SERVICE_ACCESS_TOKEN access key for the workspace

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Nightly visual-quality sweep at 07:00 UTC. The smoke job above
    # runs per-PR; this catches drift in things smoke can't assert
    # (clipping, a11y, glyph fallback, overlay z-index).
    - cron: '0 7 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (Chromium via remote service)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ github.event_name != 'schedule' }}
    env:
      CI: 'true'
      PLAYWRIGHT_SERVICE_URL: ${{ secrets.PLAYWRIGHT_SERVICE_URL }}
      PLAYWRIGHT_SERVICE_ACCESS_TOKEN: ${{ secrets.PLAYWRIGHT_SERVICE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Playwright smoke tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 14

      - name: Upload test artifacts (traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-smoke
          path: test-results/
          retention-days: 14

  quality:
    name: Visual quality (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    env:
      CI: 'true'
      PLAYWRIGHT_SERVICE_URL: ${{ secrets.PLAYWRIGHT_SERVICE_URL }}
      PLAYWRIGHT_SERVICE_ACCESS_TOKEN: ${{ secrets.PLAYWRIGHT_SERVICE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run visual-quality sweep
        run: bun run test:quality

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-quality
          path: playwright-report/
          retention-days: 14

      - name: Upload test artifacts (traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-quality
          path: test-results/
          retention-days: 14
